<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Cart Dynamic Shop Engine</title>
    <style>
        /* Base Architecture & Clean UI */
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .card {
            max-width: 800px;
            margin: 0 auto;
            background-color: #2a2a40;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h1, h3 {
            color: #00d2ff;
            text-align: center;
            border-bottom: 2px solid #3a3a5c;
            padding-bottom: 10px;
        }
        
        /* Product Showcase Layout */
        #product-showcase {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .product-card {
            background-color: #3a3a5c;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            min-width: 120px;
        }
        .product-card button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }
        .product-card button:hover { background-color: #0056b3; }

        /* Cart List Layout */
        .cart-items-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #33334d;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
        }
        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-quantity {
            background-color: #ff4757;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-quantity.increase { background-color: #2ed573; }
        
        /* Promo & Bill Summary */
        .promo-box {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .promo-box input {
            padding: 10px;
            border: none;
            border-radius: 4px;
            outline: none;
        }
        .promo-box button {
            padding: 10px 15px;
            background-color: #ffa502;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .bill-summary {
            background-color: #1e1e2f;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #3a3a5c;
        }
        .bill-summary p { font-size: 18px; margin: 8px 0; }
        #checkout-btn {
            width: 100%;
            padding: 12px;
            background-color: #00d2ff;
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🛒 Cyber-Cart Dynamic Shop Engine</h1>
        
        <div class="app-layout">
            <h3>Product Showcase</h3>
            <div id="product-showcase">
                <!-- Products will be injected here by JS -->
            </div>
            
            <h3>Your Cart Items</h3>
            <div id="cart-items-list">
                <p style="text-align:center; color:#ccc;">Your cart is empty.</p>
            </div>
            
            <div class="promo-box">
                <input type="text" id="promo-input" placeholder="Enter Coupon">
                <button onclick="ApplyPromoUI()">Apply Coupon</button>
            </div>
            <p id="promo-message" style="text-align:center; color:#2ed573;"></p>

            <div class="bill-summary">
                <p>Subtotal = $<span id="subtotal-val">0.00</span></p>
                <p>Discount = $<span id="discount-val">0.00</span></p>
                <hr>
                <p><strong>Grand Total = $<span id="grand-total-val">0.00</span></strong></p>
                <button id="checkout-btn">Proceed To Checkout</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Database & Models ---
        class Products {
            constructor(id, name, price) {
                this.id = id;
                this.name = name;
                this.price = price;
            }
        }
      // --- 2. Products list --- 
        const storeProducts = [
            new Products(5,"Football",12),
            new Products(10, "Keyboard", 15),
            new Products(20, "Mouse", 10),
            new Products(30, "Headphone", 15),
            new Products(40, "Book", 18),
            new Products(45, "Perfume", 27),
            new Products(52, "Watches", 8),
            new Products(101, "Chocolates", 3)
        ];

        let cartModel = {
            items: [], 
            appliedcoupon: null,
            discountPercentage: 0
        };

        // --- 3. Initial Setup (Render Store) ---
        function RenderStoreProducts() {
            let showcase = document.getElementById("product-showcase");
            let html = "";
            storeProducts.forEach(product => {
                html += `
                    <div class="product-card">
                        <h4>${product.name}</h4>
                        <p>$${product.price}</p>
                        <button onclick="HandleAddToCart(${product.id})">Add to Cart</button>
                    </div>
                `;
            });
            showcase.innerHTML = html;
        }

        // --- 4. Business Logic Engine ---
        function AddToCart(ProductID) {
            let targetID = Number(ProductID);
            let existingItem = cartModel.items.find(item => item.productId === targetID);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cartModel.items.push({ productId: targetID, quantity: 1 });
            }
        }

        function UpdateQuantity(ProductID, action) {
            let targetID = Number(ProductID);
            let itemIndex = cartModel.items.findIndex(item => item.productId === targetID);

            if (itemIndex !== -1) {
                if (action === "increase") {
                    cartModel.items[itemIndex].quantity += 1;
                } else if (action === "decrease") {
                    if (cartModel.items[itemIndex].quantity > 1) {
                        cartModel.items[itemIndex].quantity -= 1;
                    } else {
                        cartModel.items.splice(itemIndex, 1);
                    }
                }
            }
        }

        function ApplyCoupon(couponcode) {
            let coupon = couponcode.trim().toUpperCase();
            if (coupon === "") return "Please enter a coupon code.";
            
            if (coupon === "SAVE20") {
                cartModel.appliedcoupon = coupon;
                cartModel.discountPercentage = 20;
                return "Coupon applied successfully! (20% OFF)";
            } else {
                cartModel.appliedcoupon = null;
                cartModel.discountPercentage = 0;
                return "Invalid coupon code!";
            }
        }

        function CalculateTotals() {
            let subtotal = 0;
            cartModel.items.forEach(item => {
                let product = storeProducts.find(p => p.id === item.productId);
                if (product) {
                    subtotal += (product.price * item.quantity);
                }
            });

            let discountAmount = subtotal * (cartModel.discountPercentage / 100);
            let grandTotal = subtotal - discountAmount;

            return { subtotal, discountAmount, grandTotal };
        }

        // --- 4. UI Injection Engine (DOM Updates) ---
        function MasterUIRefresh() {
            // Cart Items Render
            let cartList = document.getElementById("cart-items-list");
            if (cartModel.items.length === 0) {
                cartList.innerHTML = "<p style='text-align:center; color:#ffffff; font-weight: bold;'>Your cart is empty.</p>";
            } else {
                let html = "";
                cartModel.items.forEach(item => {
                    let product = storeProducts.find(p => p.id === item.productId);
                    if(product) {
                        let itemTotal = product.price * item.quantity;
                        html += `
                            <div class="cart-items-row">
                                <span>${product.name} ($${product.price}) = <strong>$${itemTotal}</strong></span>
                                <div class="quantity-controls">
                                    <button class="btn-quantity" onclick="HandleQuantityChange(${product.id}, 'decrease')">-</button>
                                    <span style="font-weight:bold; width:20px; text-align:center;">${item.quantity}</span>
                                    <button class="btn-quantity increase" onclick="HandleQuantityChange(${product.id}, 'increase')">+</button>
                                </div>
                            </div>
                        `;
                    }
                });
                cartList.innerHTML = html;
            }

            // Bill Summary Render
            let totals = CalculateTotals();
            document.getElementById("subtotal-val").innerText = totals.subtotal.toFixed(2);
            document.getElementById("discount-val").innerText = totals.discountAmount.toFixed(2);
            document.getElementById("grand-total-val").innerText = totals.grandTotal.toFixed(2);
        }

        // --- 5. Event Handlers (Connecting Buttons to Logic) ---
        function HandleAddToCart(id) {
            AddToCart(id);
            MasterUIRefresh(); // Update screen instantly
        }

        function HandleQuantityChange(id, action) {
            UpdateQuantity(id, action);
            MasterUIRefresh(); // Update screen instantly
        }

        function ApplyPromoUI() {
            let code = document.getElementById("promo-input").value;
            let msgBox = document.getElementById("promo-message");
            let result = ApplyCoupon(code);
            
            msgBox.innerText = result;
            if(result.includes("Invalid") || result.includes("Please")) {
                msgBox.style.color = "#ff4757"; // Red for error
            } else {
                msgBox.style.color = "#2ed573"; // Green for success
            }
            MasterUIRefresh(); // Re-calculate and update bill
        }

        // Run this when the page loads to show the products
        window.onload = () => {
            RenderStoreProducts();
        };

    </script>
</body>
</html>
